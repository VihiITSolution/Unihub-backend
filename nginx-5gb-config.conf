# Nginx configuration for UniHub
# Apply to: /etc/nginx/sites-available/unihub (or similar)
#
# DEPLOY STEPS:
#   ssh user@206.189.133.69
#   sudo nano /etc/nginx/sites-available/unihub   # paste this file
#   sudo nginx -t && sudo systemctl reload nginx

http {
    client_max_body_size 5g;
    client_body_timeout  600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    client_body_buffer_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}

upstream backend {
    server localhost:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name unihub.lk;

    client_max_body_size 5g;
    client_body_timeout  600s;

    # ── All API routes go to the main backend (port 5000) ──────────────────
    # This includes /api/social/* which is now handled by the main backend.
    # The separate Unihub-social microservice is no longer needed in nginx.
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Disable buffering for large uploads so nginx doesn't hold the
        # entire body in memory before forwarding it to Express.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── Serve uploaded files directly from disk ─────────────────────────────
    location /uploads {
        alias /path/to/Unihub-backend/uploads;   # ← update this path
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Socket.io (chat / live sessions) ───────────────────────────────────
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
