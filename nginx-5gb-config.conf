# Nginx configuration snippet for 5GB file upload support
# Use this in your reverse proxy configuration (e.g., /etc/nginx/sites-available/unihub)

# Key settings for supporting large file uploads:

# 1. In the http block (global) or server block:
http {
    # Increase client max body size to 5GB
    client_max_body_size 5g;

    # Increase timeouts for large uploads
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # For large request bodies, use buffering
    client_body_buffer_size 1m;

    # Required for the /socket.io/ location below: Socket.io's initial
    # handshake is plain HTTP (no Upgrade header), only later requests
    # upgrade to a WebSocket, so Connection must vary per-request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}

# 2. In your upstream backend block:
upstream backend {
    server localhost:5000;
    # Keep-alive connections for efficiency
    keepalive 32;
}

# Unihub-social microservice (wall posts, follows, profile pictures) -
# see Unihub-social/README.md
upstream social {
    server localhost:5001;
    keepalive 32;
}

# 3. In your server block (unihub.lk):
server {
    listen 80;
    server_name unihub.lk;
    
    # Ensure client_max_body_size is set here too (can override http block)
    client_max_body_size 5g;
    client_body_timeout 300s;
    
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # Headers for large uploads
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Forward original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection headers
        proxy_set_header Connection "";
    }


    # Socket.io - separate location so the WebSocket upgrade isn't buried
    # under /api's buffering-disabled config above. Required for the chat
    # feature's real-time delivery/typing/presence.
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WS connections open
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }


    # Unihub-social microservice - everything under /api/social is a
    # separate service/container from the main backend above.
    location /api/social/ {
        proxy_pass http://social;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }


}

