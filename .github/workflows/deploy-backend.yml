name: Deploy Backend to Digital Ocean

# Trigger on push to main branch
on:
  push:
    branches:
      - main

concurrency:
  group: unihub-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub (or your registry)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-backend:buildcache,mode=max

      # Step 5: Deploy to Digital Ocean Droplet
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail

            sudo -n systemctl is-active --quiet nginx
            if [ "$(docker inspect --format='{{.State.Running}}' unihub-nginx 2>/dev/null || echo false)" = "true" ]; then
              echo "Deployment aborted: host Nginx and the legacy Docker Nginx cannot run together"
              exit 1
            fi

            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Shared with unihub-social so avatar/post-image uploads written
            # by that service are servable from this one's /uploads route.
            docker volume create unihub-uploads || true

            # Stop and remove old container
            docker stop unihub-backend || true
            docker rm unihub-backend || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest

            # Run new container
            docker run -d \
              --name unihub-backend \
              --network unihub-network \
              --restart unless-stopped \
              -p 5000:3000 \
              -v unihub-uploads:/app/uploads \
              -e NODE_ENV=production \
              -e HOST=0.0.0.0 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e CORS_ORIGIN=${{ secrets.CORS_ORIGIN }} \
              -e CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
              -e CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} \
              -e CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }} \
              -e YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }} \
              -e YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }} \
              -e YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }} \
              -e YOUTUBE_JAVASCRIPT_ORIGIN=${{ secrets.YOUTUBE_JAVASCRIPT_ORIGIN }} \
              -e YOUTUBE_REDIRECT_URI=${{ secrets.YOUTUBE_REDIRECT_URI }} \
              -e YOUTUBE_REDIRECT_URI_LOCAL=${{ secrets.YOUTUBE_REDIRECT_URI_LOCAL }} \
              -e YOUTUBE_ACCESS_TOKEN=${{ secrets.YOUTUBE_ACCESS_TOKEN }} \
              -e TEAMS_LIVE_ENABLED=${{ secrets.TEAMS_LIVE_ENABLED }} \
              -e TEAMS_LIVE_WORKER_ENABLED=${{ secrets.TEAMS_LIVE_WORKER_ENABLED }} \
              -e TEAMS_LIVE_WORKER_INTERVAL_MS=${{ secrets.TEAMS_LIVE_WORKER_INTERVAL_MS }} \
              -e TEAMS_SESSION_BUFFER_MINUTES=${{ secrets.TEAMS_SESSION_BUFFER_MINUTES }} \
              -e TEAMS_TENANT_ID=${{ secrets.TEAMS_TENANT_ID }} \
              -e TEAMS_CLIENT_ID=${{ secrets.TEAMS_CLIENT_ID }} \
              -e TEAMS_CLIENT_SECRET=${{ secrets.TEAMS_CLIENT_SECRET }} \
              -e TEAMS_ORGANIZER_EMAIL=${{ secrets.TEAMS_ORGANIZER_EMAIL }} \
              -e TEAMS_ORGANIZER_USER_ID=${{ secrets.TEAMS_ORGANIZER_USER_ID }} \
              -e TEAMS_INVITE_REDIRECT_URL=${{ secrets.TEAMS_INVITE_REDIRECT_URL }} \
              -e TEAMS_LOBBY_BYPASS_SCOPE=${{ secrets.TEAMS_LOBBY_BYPASS_SCOPE }} \
              -e SMSGO_API_BASE_URL=${{ secrets.SMSGO_API_BASE_URL }} \
              -e SMSGO_API_KEY=${{ secrets.SMSGO_API_KEY }} \
              -e SMSGO_MASK=${{ secrets.SMSGO_MASK }} \
              -e SMSGO_SANDBOX=${{ secrets.SMSGO_SANDBOX }} \
              -e SMSGO_TIMEOUT_MS=${{ secrets.SMSGO_TIMEOUT_MS }} \
              -e RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
              -e EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
              -e RESEND_TIMEOUT_MS=${{ secrets.RESEND_TIMEOUT_MS }} \
              -e AUTH_OTP_PEPPER=${{ secrets.AUTH_OTP_PEPPER }} \
              ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest

            # Run the idempotent schema migration before exposing registration.
            docker exec unihub-backend npm run migrate:sms-auth

            for attempt in $(seq 1 40); do
              if [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' unihub-backend)" = "healthy" ]; then
                break
              fi
              if [ "${attempt}" -eq 40 ]; then
                echo "Backend container did not become healthy"
                docker logs --tail 150 unihub-backend
                exit 1
              fi
              sleep 2
            done

            test -x /usr/local/bin/update-docker-hosts.sh
            sudo -n /usr/local/bin/update-docker-hosts.sh
            sudo -n nginx -t
            sudo -n systemctl reload nginx

            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 15 --insecure \
                --resolve unihub.lk:443:127.0.0.1 https://unihub.lk/ >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 15 ]; then
                echo "Origin smoke test failed after Backend deployment"
                sudo -n tail -n 100 /var/log/nginx/error.log || true
                exit 1
              fi
              sleep 2
            done

            docker ps --filter name=unihub-backend --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

            # Clean up old images
            docker image prune -a -f
