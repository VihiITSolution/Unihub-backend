name: Deploy Backend to Digital Ocean

# Trigger on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub (or your registry)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-backend:buildcache,mode=max

      # Step 5: Deploy to Digital Ocean Droplet
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Stop and remove old container
            docker stop unihub-backend || true
            docker rm unihub-backend || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest

            # Run new container
            docker run -d \
              --name unihub-backend \
              --network unihub-network \
              --restart unless-stopped \
              -p 5000:3000 \
              -e NODE_ENV=production \
              -e HOST=0.0.0.0 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e CORS_ORIGIN=${{ secrets.CORS_ORIGIN }} \
              -e CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }} \
              -e CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }} \
              -e CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }} \
              -e YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }} \
              -e YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }} \
              -e YOUTUBE_JAVASCRIPT_ORIGIN=${{ secrets.YOUTUBE_JAVASCRIPT_ORIGIN }} \
              -e YOUTUBE_REDIRECT_URI=${{ secrets.YOUTUBE_REDIRECT_URI }} \
              -e YOUTUBE_REDIRECT_URI_LOCAL=${{ secrets.YOUTUBE_REDIRECT_URI_LOCAL }} \
              -e YOUTUBE_REFRESH_TOKEN = ${{ secrets.YOUTUBE_REFRESH_TOKEN }} \
              -e YOUTUBE_ACCESS_TOKEN = ${{ secrets.YOUTUBE_ACCESS_TOKEN }} \
              ${{ secrets.DOCKER_USERNAME }}/unihub-backend:latest

            # Clean up old images
            docker image prune -f
